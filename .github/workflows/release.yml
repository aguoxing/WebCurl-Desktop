name: Release

# 打 tag 即发布：推送 v1.0.1 → 产出 webcurl-desktop-v1.0.1-<os>-<arch>.zip 与 SHA256SUMS。
#
# 资产命名与清单格式**必须**与 internal/updater 的匹配规则保持一致，
# 否则应用内更新会静默地「找不到可用更新」（见 internal/updater/github.go）：
#
#   pickAsset        资产名须同时含 GOOS 与 GOARCH；amd64 也接受 x86_64，
#                    arm64 也接受 aarch64。SHA256SUMS 自身不会被选中。
#   isChecksumAsset  清单文件名以 SHA256SUMS 开头（或 .sha256 / sha256sums.txt 结尾）
#   parseChecksumFile 每行 "<hex>  <资产名>"，兼容 sha256sum 的 "*" 前缀，只比对文件名
#   解压                zip 内层直接放可执行文件，不能多包一层目录
#
# 这几条正是 scripts/build.sh --release 的产出格式，所以这里不自己拼 zip，
# 一律走那个脚本，保证本地与 CI 的产物完全同源。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，不带 v 前缀（手动触发时必填）'
        required: true
        type: string

# 创建 Release 需要写权限；其余一律只读。
permissions:
  contents: write

jobs:
  # tag 推送不会触发 ci.yml（它只监听分支），因此这里先自己把质量门跑一遍，
  # 避免把一个测不过的提交直接发成正式版本。
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # 与 ci.yml 相同的两件前置：embed 占位 + Linux cgo 依赖。
      # 这里的 verify 不构建前端，但根包 main.go 的
      # `//go:embed all:frontend/dist` 在解析阶段就要求该目录有文件。
      - name: 准备前端 embed 占位
        run: |
          mkdir -p frontend/dist
          if [ ! -f frontend/dist/index.html ]; then
            printf '%s\n' '<!doctype html><title>placeholder</title>' > frontend/dist/index.html
          fi

      # internal/app → Wails v3 的 Linux 实现要求 cgo + gtk4/webkitgtk-6.0。
      - name: 安装 Linux 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      - name: gofmt
        run: |
          unformatted=$(gofmt -l internal cmd main.go)
          if [ -n "$unformatted" ]; then
            echo "以下文件未格式化，请运行 gofmt -w："
            echo "$unformatted"
            exit 1
          fi

      # 包范围与 ci.yml 一致：根包只做 vet，build/ios 里那个没有 func main 的
      # package main 让 `go build ./...` 必然失败。
      - name: vet / build / test
        run: |
          go vet ./internal/... ./cmd/... .
          go build ./internal/... ./cmd/...
          go test ./internal/... ./cmd/...

  build:
    needs: verify
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      # 某个平台翻车时不要取消其余平台：一个平台少一个资产，总好过整次发布作废。
      fail-fast: false
      matrix:
        include:
          - platform: windows/amd64
            slug: windows-amd64
            runner: windows-latest
          - platform: darwin/arm64
            slug: darwin-arm64
            runner: macos-latest
          # macos-13（Intel）已于 2025-12 退役；macos-15-intel 是当前的
          # x86_64 宿主（计划 2027-08 退役）。若该标签不可用，
          # 可改成在 macos-latest 上交叉编译（Go 支持 darwin/amd64 交叉）。
          - platform: darwin/amd64
            slug: darwin-amd64
            runner: macos-15-intel
          - platform: linux/amd64
            slug: linux-amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            slug: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # pnpm 必须在 setup-node 之前装好，后者要靠它做依赖缓存。
      #
      # 版本必须与 frontend/pnpm-lock.yaml 及本地开发环境一致。这里原来 pin 成 9，
      # 而 frontend/pnpm-workspace.yaml 用的是 pnpm 12 的配置格式（allowBuilds /
      # minimumReleaseAgeExclude），pnpm 9 解析它时找不到 packages 字段，直接报错
      # 并中断构建：ERROR packages field missing or empty
      #
      # 也试过交给 frontend/package.json 的 packageManager 字段声明版本，但
      # pnpm 12.5.1 会据此要求在 lockfile 里补一段 packageManagerDependencies，
      # 而它写这段内容时会把 lockfile 变成两个文档的拼接（两个 lockfileVersion），
      # 随后 --frozen-lockfile 直接失败：
      #   ERR_PNPM_FROZEN_LOCKFILE_WITH_OUTDATED_LOCKFILE
      # 所以版本只在这里声明一处，package.json 里刻意不放 packageManager。
      - uses: pnpm/action-setup@v6
        with:
          version: "12.5.1"

      - uses: actions/setup-node@v4
        with:
          # 与 pnpm 12 的要求及本地开发环境保持一致。
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # 默认 GTK4 + WebKitGTK 6.0 技术栈，需要 Ubuntu 24.04+（ubuntu-latest 正是）。
      # 若将来 runner 退回到只提供 WebKit2GTK 4.1 的版本，改为安装
      # libgtk-3-dev libwebkit2gtk-4.1-dev 并以 -tags gtk3 构建。
      - name: 安装 Linux 构建依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev

      # 版本与 go.mod 中声明的 Wails 对齐，避免 CLI 与库版本漂移导致生成的
      # 绑定/资源与代码不匹配。
      - name: 安装 wails3 与 task
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28
          go install github.com/go-task/task/v3/cmd/task@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${{ github.ref_name }}"; fi
          echo "value=${v#v}" >> "$GITHUB_OUTPUT"

      # --version 会经 GOWS_VERSION → -ldflags -X 注入二进制，
      # 因此「当前版本」由二进制自身携带，不依赖随包分发的配置文件。
      - name: 构建发布包
        shell: bash
        run: |
          ./scripts/build.sh \
            --version "${{ steps.ver.outputs.value }}" \
            --release \
            --platform "${{ matrix.platform }}"

      - name: 收集产物
        shell: bash
        run: |
          mkdir -p out
          cp release/*.zip out/
          # 每个平台单独上传一份摘要，由发布作业合并成一份 SHA256SUMS。
          # 若这里直接叫 SHA256SUMS，多个 artifact 在 merge-multiple 时会互相覆盖。
          cp release/SHA256SUMS "out/SHA256SUMS.${{ matrix.slug }}"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.slug }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # --generate-notes 要读提交历史，浅克隆会取不到。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 合并 SHA256SUMS
        shell: bash
        run: |
          cd dist
          # 排序保证每次生成的清单顺序稳定，便于人工比对。
          cat $(ls SHA256SUMS.* | sort) > SHA256SUMS
          rm -f SHA256SUMS.*
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS
          echo "--- assets ---"
          ls -1 *.zip

      - name: 解析版本号
        id: ver
        shell: bash
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then v="${{ github.ref_name }}"; fi
          echo "value=${v#v}" >> "$GITHUB_OUTPUT"

      # 已存在同名 Release 时改为覆盖上传，这样重跑 workflow 不会卡在
      # "release already exists" 上。
      - name: 创建或更新 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.ver.outputs.value }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖上传资产"
            gh release upload "$TAG" dist/*.zip dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes \
              dist/*.zip dist/SHA256SUMS
          fi
